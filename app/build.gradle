plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.datewidget'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.datewidget'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 簡單起見,release 也使用 debug 簽章,可直接安裝
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
